[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "riichi-analysis-engine"
version = "0.1.0.dev0"
description = "A multi-task analysis engine for Riichi Mahjong Studio."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "AGPL-3.0-or-later"
dependencies = [
  "numpy>=2.0,<3",
  "torch>=2.7,<3",
]

[project.optional-dependencies]
train = [
  "tqdm>=4.67,<5",
]
build = [
  "pyinstaller>=6.20,<7",
]
test = [
  "pytest>=8.3,<9",
]

[project.scripts]
riichi-analysis-prepare = "riichi_analysis_engine.prepare:main"
riichi-analysis-convert = "riichi_analysis_engine.convert:main"
riichi-analysis-train = "riichi_analysis_engine.train:main"
riichi-analysis-audit-model = "riichi_analysis_engine.audit_model:main"
riichi-analysis-export-weights = "riichi_analysis_engine.export_weights:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
